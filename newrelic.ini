# ---------------------------------------------------------------------------
#
# New Relic Python Agent Configuration
# App: MAF Incident Triage Pipeline
#
# Docs: https://docs.newrelic.com/docs/apm/agents/python-agent/configuration/python-agent-configuration/
#
# ---------------------------------------------------------------------------

[newrelic]

# License key (reads from env var NEW_RELIC_LICENSE_KEY)
license_key = %(NEW_RELIC_LICENSE_KEY)s

# Application name as shown in New Relic UI
app_name = maf-incident-triage

# Enable/disable agent data collection
monitor_mode = true

# Log output destination
log_file = newrelic-agent.log

# Log level: critical, error, warning, info, debug
log_level = debug

# High Security Mode - strips sensitive data
high_security = false

# Transaction tracer - captures slow transaction details
transaction_tracer.enabled = true
transaction_tracer.transaction_threshold = apdex_f
transaction_tracer.record_sql = obfuscated
transaction_tracer.stack_trace_threshold = 0.5
transaction_tracer.explain_enabled = true
transaction_tracer.explain_threshold = 0.5

# Error collector - captures uncaught/logged exceptions
error_collector.enabled = true

# Browser monitoring (not applicable for CLI/API apps)
browser_monitoring.auto_instrument = false

# Thread profiler
thread_profiler.enabled = true

# Distributed tracing (required for cross-service correlation + AI monitoring)
distributed_tracing.enabled = true

# AI Monitoring - captures LLM inputs, outputs, and token usage
# Requires distributed_tracing.enabled = true
# Docs: https://docs.newrelic.com/docs/ai-monitoring/intro-to-ai-monitoring/
ai_monitoring.enabled = true
ai_monitoring.streaming.enabled = true
ai_monitoring.record_content.enabled = true

# Span events - increase to max for AI monitoring (docs recommendation)
span_events.enabled = true
span_events.max_samples_stored = 10000

# Event loop visibility - surfaces asyncio blocking (useful for async agent pipelines)
event_loop_visibility.enabled = true
event_loop_visibility.blocking_threshold = 0.1

# GC runtime metrics - track memory pressure from multi-agent workloads
gc_runtime_metrics.enabled = true

# Code-level metrics - links traces to source code
code_level_metrics.enabled = true

# Application logging - forward logs to New Relic
application_logging.enabled = true
application_logging.forwarding.enabled = true
application_logging.metrics.enabled = true

# ---------------------------------------------------------------------------

[newrelic:development]
monitor_mode = false

[newrelic:test]
monitor_mode = false

[newrelic:staging]
app_name = maf-incident-triage (Staging)
monitor_mode = true

[newrelic:production]
monitor_mode = true

# ---------------------------------------------------------------------------
